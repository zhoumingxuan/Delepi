appId: com.delepi.app
productName: Delepi
directories:
  output: release-mac
  buildResources: resources
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/python-mac
    to: python
    filter:
      - "**/*"
  - from: skills
    to: skills
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: resources/icon-mac.png
  identity: "-"
  hardenedRuntime: false
  artifactName: Delepi-${version}-${arch}.${ext}
