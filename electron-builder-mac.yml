appId: com.delepi.app
productName: Delepi
# 客户端自动更新 L3 构建期注入（不声明 publish，避免生成第二套 latest.yml 版本真相）
extraMetadata:
  delepiUpdate:
    baseUrl: http://10.1.52.167:8033
directories:
  output: release-mac
  buildResources: resources
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/python-mac
    to: python
    filter:
      - "**/*"
  - from: skills
    to: skills
  - from: main-skills
    to: main-skills
mac:
  target: dmg
  icon: resources/icon.png
