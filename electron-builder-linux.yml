appId: com.delepi.app
productName: Delepi
# 客户端自动更新：不声明 publish，避免生成第二套 latest.yml 版本真相
directories:
  output: release-linux
  buildResources: resources
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/python-linux
    to: python
    filter:
      - "**/*"
  - from: skills
    to: skills
  - from: main-skills
    to: main-skills
linux:
  target: AppImage
  icon: resources/icon.png
  category: Utility
